name: Build CI

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build arm64 Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            --build-cache \
            --parallel \
            --daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lemuroid-release-apk
          path: lemuroid-app/build/intermediates/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk
          archive: false
